---
# Use the k3s in-cluster Helm controller (HelmChart CRD) so we don't need helm
# CLI on the laptop. The controller resolves and applies the chart.

- name: Apply Longhorn HelmChart CRD
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: longhorn
        namespace: kube-system
      spec:
        chart: longhorn
        repo: https://charts.longhorn.io
        version: "{{ longhorn_chart_version }}"
        targetNamespace: "{{ longhorn_namespace }}"
        createNamespace: true
        valuesContent: |-
          defaultSettings:
            defaultDataPath: "{{ longhorn_storage_path }}"
            defaultReplicaCount: {{ longhorn_default_replicas }}
            createDefaultDiskLabeledNodes: true
            # Soft anti-affinity: prefer different nodes/zones per replica, but
            # allow co-location when there aren't enough distinct ones. With
            # all storage workers in a single L2 zone (net-10-0-0), strict
            # zone-anti-affinity blocks 3-replica scheduling outright.
            replicaSoftAntiAffinity: true
            replicaZoneSoftAntiAffinity: true
            storageOverProvisioningPercentage: 100
            storageMinimalAvailablePercentage: 10
          persistence:
            defaultClass: true
            defaultClassReplicaCount: {{ longhorn_default_replicas }}
            reclaimPolicy: Retain
          longhornUI:
            replicas: 1
          # No control-plane toleration — Longhorn's CSI plugin and engine-image
          # DaemonSets don't ship with one either, so any pod scheduled on a
          # control-plane node can't attach Longhorn PVCs. Storage stays on
          # workers (rpid3-rpid10).
          longhornManager: {}

- name: Wait for Longhorn manager DaemonSet to roll out
  kubernetes.core.k8s_info:
    kubeconfig: "{{ local_kubeconfig }}"
    api_version: apps/v1
    kind: DaemonSet
    namespace: "{{ longhorn_namespace }}"
    name: longhorn-manager
  register: lh_ds
  until: (lh_ds.resources | length > 0) and (lh_ds.resources[0].status.numberReady | default(0) | int >= 1)
  retries: 90
  delay: 10

- name: Wait for default StorageClass to be created
  kubernetes.core.k8s_info:
    kubeconfig: "{{ local_kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: longhorn
  register: sc
  until: sc.resources | length > 0
  retries: 30
  delay: 5

- name: Label storage nodes for Longhorn
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: patched
    kind: Node
    name: "{{ item.split('.')[0] }}"
    definition:
      metadata:
        labels:
          node.longhorn.io/create-default-disk: "true"
  loop: "{{ groups['k3s_servers'] + groups['k3s_agents'] }}"
  when: hostvars[item].longhorn_storage | default(false)

- name: Patch the longhorn StorageClass to ensure {{ longhorn_default_replicas }} replicas
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: patched
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: longhorn
    definition:
      parameters:
        numberOfReplicas: "{{ longhorn_default_replicas | string }}"
        staleReplicaTimeout: "30"

- name: Show Longhorn manager pods
  kubernetes.core.k8s_info:
    kubeconfig: "{{ local_kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ longhorn_namespace }}"
    label_selectors:
      - app=longhorn-manager
  register: lh_pods

- ansible.builtin.debug:
    msg: "Longhorn ready: {{ lh_pods.resources | length }} manager pods running"

# Expose the Longhorn UI via the same dual-ingress pattern as cn-* apps,
# gated by nginx-ingress basic auth (the longhorn-ui-auth Secret holds the
# htpasswd). The htpasswd is Kauket-managed (k8s.longhorn_ui_auth_env,
# profile role.k8s_admin); apply-secrets.sh materializes the Secret from the
# Kauket-installed env file. Swap basic-auth annotations for Authentik
# forward-auth when Authentik lands.
- name: Materialize longhorn-ui-auth Secret from Kauket
  ansible.builtin.command:
    cmd: "{{ role_path }}/files/apply-secrets.sh"
  environment:
    KUBECONFIG: "{{ local_kubeconfig }}"
    LONGHORN_NAMESPACE: "{{ longhorn_namespace }}"
  changed_when: true

# ── Authentik outpost Services pointing at neptune-hosted outposts ───────
#
# Two outposts in cn-authentik on neptune.lan: outpost-cluster-lan
# (10.1.1.92:9301, single provider longhorn-lan, browser host
# auth.neptune.lan) and outpost-cluster (10.1.1.92:9300, single provider
# longhorn-lab, browser host auth.lab.gn.al). One-provider-per-outpost
# is necessary because ingress-nginx v1.15 doesn't forward Set-Cookie on
# the 401 path from auth-response-headers, so the multi-provider /start
# disambiguation via cookies doesn't work.
#
# Each Service has a paired Endpoints object that maps the in-cluster
# DNS name to the external 10.1.1.92:<port>, so the Ingress path-based
# rule below can route /outpost.goauthentik.io/* to the right outpost.

- name: In-cluster Service for outpost-cluster-lan (→ neptune:9301)
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: outpost-cluster-lan
        namespace: "{{ longhorn_namespace }}"
      spec:
        ports:
          - port: 9000
            targetPort: 9301
            protocol: TCP

- name: Endpoints for outpost-cluster-lan
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: outpost-cluster-lan
        namespace: "{{ longhorn_namespace }}"
      subsets:
        - addresses: [{ip: 10.1.1.92}]
          ports: [{port: 9301}]

- name: In-cluster Service for outpost-cluster (→ neptune:9300)
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: outpost-cluster
        namespace: "{{ longhorn_namespace }}"
      spec:
        ports:
          - port: 9000
            targetPort: 9300
            protocol: TCP

- name: Endpoints for outpost-cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Endpoints
      metadata:
        name: outpost-cluster
        namespace: "{{ longhorn_namespace }}"
      subsets:
        - addresses: [{ip: 10.1.1.92}]
          ports: [{port: 9300}]

- name: Expose Longhorn UI via LAN ingress (longhorn.k8s.lan)
  # Two paths on the SAME host: /outpost.goauthentik.io/* → outpost-cluster-lan
  # service, /* → longhorn-frontend. This keeps all OIDC session cookies on
  # the longhorn.k8s.lan domain, since /start, /auth/nginx, and /callback all
  # run on that hostname (path-routed to the outpost). The canonical Authentik
  # k8s ingress pattern; sidesteps the cross-domain cookie problem.
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn-ui-lan
        namespace: "{{ longhorn_namespace }}"
        annotations:
          coredns.io/hostname: longhorn.k8s.lan
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          # auth-url is server-side from k3s nginx-ingress to the outpost
          # on neptune LAN. Bypasses the in-cluster Service to keep the
          # subrequest path short.
          nginx.ingress.kubernetes.io/auth-url: "http://10.1.1.92:9301/outpost.goauthentik.io/auth/nginx"
          # auth-signin is browser-facing. Same host as the protected
          # app (longhorn.k8s.lan); path-based routing below sends
          # /outpost.goauthentik.io/* to outpost-cluster-lan service.
          nginx.ingress.kubernetes.io/auth-signin: "http://longhorn.k8s.lan/outpost.goauthentik.io/start?rd=$escaped_request_uri"
          nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      spec:
        ingressClassName: nginx
        rules:
          - host: longhorn.k8s.lan
            http:
              paths:
                - path: /outpost.goauthentik.io
                  pathType: Prefix
                  backend:
                    service:
                      name: outpost-cluster-lan
                      port:
                        number: 9000
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: longhorn-frontend
                      port:
                        number: 80

- name: Expose Longhorn UI via tailnet ingress (longhorn.lab.gn.al)
  # Same shape as the LAN ingress, but with outpost-cluster (the tailnet
  # outpost — authentik_host_browser=auth.lab.gn.al). auth-signin uses
  # HTTPS because VPS traefik-lab terminates TLS for the tailnet hop.
  kubernetes.core.k8s:
    kubeconfig: "{{ local_kubeconfig }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn-ui-lab
        namespace: "{{ longhorn_namespace }}"
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          nginx.ingress.kubernetes.io/auth-url: "http://10.1.1.92:9300/outpost.goauthentik.io/auth/nginx"
          nginx.ingress.kubernetes.io/auth-signin: "https://longhorn.lab.gn.al/outpost.goauthentik.io/start?rd=$escaped_request_uri"
          nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      spec:
        ingressClassName: nginx
        rules:
          - host: longhorn.lab.gn.al
            http:
              paths:
                - path: /outpost.goauthentik.io
                  pathType: Prefix
                  backend:
                    service:
                      name: outpost-cluster
                      port:
                        number: 9000
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: longhorn-frontend
                      port:
                        number: 80
